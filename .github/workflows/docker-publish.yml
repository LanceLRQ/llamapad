# Docker Hub 发布 workflow。
#
# 触发方式：仅 `v*.*.*` 格式的 tag push（dev/main 分支推送不触发构建）。
# 所需 secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Docker Hub Access Token，Read & Write 权限）。
# 版本真源：package.json 的 version 字段——tag 必须等于 `v` + 该版本号，不等直接失败。

name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  IMAGE_NAME: lancelrq/llamapad

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck 部署管理脚本
        run: shellcheck deploy/llamapad.sh deploy/tests/smoke.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 与 package.json version 一致
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 version ${PKG_VERSION} 不一致"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # next-env.d.ts 与 .next/types 不入库，CI 全新 checkout 没有这两样，tsc 会报
      # LayoutProps 等 Next 生成类型找不到；先跑 next typegen 补出来，tsc 才能过
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "list<<EOF"
            if [[ "$VERSION" == *-* ]]; then
              echo "${IMAGE_NAME}:${VERSION}"
            else
              echo "${IMAGE_NAME}:${VERSION}"
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
