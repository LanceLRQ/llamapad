services:
  llamapad:
    image: llamapad:v0.1.0-rc # 本地构建（docker build -t llamapad:v0.1.0-rc ..），不发布远端仓库
    container_name: llamapad
    restart: unless-stopped
    # 运行身份：面板要写 config 与 models 两个 bind 目录，容器内用户必须对它们可写。
    # 镜像默认 node(1000)；宿主目录属主不是 1000 时在 .env 设 PUID/PGID 对齐
    # （models 库常见为 root 属主 → PUID=0 PGID=0），免去 chown 既有模型库。
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    gpus: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/llama/config:/app/config
      - /root/workspace/llama/models:/host-models
    environment:
      - PANEL_DOCKER=real
      - PANEL_CONFIG=/app/config/panel.yaml
      - PANEL_DB=/app/config/panel.db
      - PANEL_ADMIN_PASSWORD=${PANEL_ADMIN_PASSWORD:?请在 deploy/.env 提供}
      - PANEL_LLAMA_HOST=host.docker.internal # 面板容器内访问宿主机发布的 llama-server 端口
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux 需显式映射（Docker 20.10+）
    group_add:
      - "984" # docker.sock 的 gid（stat -c %g /var/run/docker.sock），跨机器部署时按实际修改
